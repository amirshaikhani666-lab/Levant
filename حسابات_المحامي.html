<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابات المحامي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy-950:#042d25;
    --navy-900:#0b3d32;
    --navy-800:#145041;
    --navy-700:#1d6552;
    --brass:#b59247;
    --brass-light:#cbaf6d;
    --paper:#f6f4ee;
    --paper-2:#ffffff;
    --ink:#1c2530;
    --ink-soft:#5b6472;
    --line:#e2ddd0;
    --green:#2f6b4f;
    --red:#a13c3c;
    --shadow: 0 8px 24px rgba(13,27,46,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  /* ===== Header ===== */
  .masthead{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:22px;margin-bottom:26px;
    border-bottom:2px solid var(--navy-900);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    height:44px;width:auto;flex-shrink:0;
    display:block;object-fit:contain;
  }
  .brand h1{
    font-family:'Amiri',serif;font-size:26px;font-weight:700;
    color:var(--navy-900);margin:0;letter-spacing:.3px;
  }
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .lawyer-name-field{
    font-size:13px;color:var(--ink-soft);text-align:left;
  }
  .lawyer-name-field input{
    border:none;background:transparent;border-bottom:1px dashed var(--line);
    font-family:inherit;font-size:14px;color:var(--navy-900);font-weight:600;
    padding:4px 2px;text-align:left;width:180px;
  }
  .lawyer-name-field input:focus{outline:none;border-color:var(--brass);}

  /* ===== Layout ===== */
  .layout{display:grid;grid-template-columns:300px 1fr;gap:24px;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  /* ===== Client list panel ===== */
  .panel{
    background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
    box-shadow:var(--shadow);
  }
  .panel-head{
    padding:16px 18px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .panel-head h2{margin:0;font-size:15px;color:var(--navy-900);font-weight:700;}
  .btn{
    border:none;border-radius:5px;font-family:inherit;cursor:pointer;
    font-weight:600;transition:filter .15s, transform .1s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-brass{background:var(--brass);color:#fff;padding:8px 14px;font-size:13px;}
  .btn-brass:hover{filter:brightness(1.08);}
  .btn-navy{background:var(--navy-900);color:#fff;padding:9px 16px;font-size:13.5px;}
  .btn-navy:hover{filter:brightness(1.15);}
  .btn-ghost{background:transparent;color:var(--navy-800);border:1px solid var(--line);padding:8px 14px;font-size:13px;}
  .btn-ghost:hover{background:var(--paper);}
  .btn-danger-ghost{background:transparent;color:var(--red);border:1px solid #e4c9c9;padding:6px 12px;font-size:12.5px;}
  .btn-danger-ghost:hover{background:#fbf1f1;}
  .btn-sm{padding:6px 12px;font-size:12.5px;}

  .client-list{list-style:none;margin:0;padding:8px;max-height:640px;overflow-y:auto;}
  .client-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 12px;border-radius:5px;cursor:pointer;margin-bottom:3px;
    border:1px solid transparent;
  }
  .client-item:hover{background:var(--paper);}
  .client-item.active{background:var(--navy-900);}
  .client-item.active .c-name{color:#fff;}
  .client-item.active .c-balance{color:var(--brass-light);}
  .c-name{font-weight:600;font-size:14px;color:var(--ink);}
  .c-balance{font-size:12.5px;font-weight:700;margin-top:2px;}
  .c-balance.pos{color:var(--green);}
  .c-balance.neg{color:var(--red);}
  .empty-hint{padding:30px 18px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.9;}

  /* ===== Main content ===== */
  .main-panel{min-height:600px;}
  .client-header{
    padding:22px 24px;border-bottom:1px solid var(--line);
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .client-header h2{margin:0 0 4px;font-family:'Amiri',serif;font-size:22px;color:var(--navy-900);}
  .client-meta{font-size:12.5px;color:var(--ink-soft);}
  .client-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .balance-strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border-bottom:1px solid var(--line);
  }
  .bal-cell{background:var(--paper-2);padding:16px 20px;text-align:center;}
  .bal-cell .lbl{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .bal-cell .val{font-size:20px;font-weight:700;font-family:'Amiri',serif;}
  .bal-cell.due .val{color:var(--green);}
  .bal-cell.paid .val{color:var(--navy-800);}
  .bal-cell.balance .val{}
  .bal-cell.balance .val.pos{color:var(--green);}
  .bal-cell.balance .val.neg{color:var(--red);}

  .tabs{display:flex;border-bottom:1px solid var(--line);padding:0 20px;gap:4px;}
  .tab{
    padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab.active{color:var(--navy-900);border-bottom-color:var(--brass);}

  .tab-body{padding:20px 24px 28px;}

  .entry-form{
    display:grid;grid-template-columns:130px 1fr 120px 130px;gap:10px;margin-bottom:16px;
    background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;
  }
  @media (max-width:700px){.entry-form{grid-template-columns:1fr 1fr;}}
  .entry-form input, .entry-form select{
    font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);
    border-radius:4px;background:#fff;color:var(--ink);width:100%;
  }
  .entry-form input:focus, .entry-form select:focus{outline:none;border-color:var(--brass);}
  .entry-form button{grid-column:1/-1;justify-self:start;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:right;font-size:12px;color:var(--ink-soft);font-weight:600;
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:11px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top;}
  tbody tr:hover{background:var(--paper);}
  .amount-cell{font-weight:700;font-family:'Amiri',serif;font-size:14.5px;}
  .amount-cell.due{color:var(--green);}
  .amount-cell.paid{color:var(--navy-800);}
  .note-cell{color:var(--ink-soft);font-size:12.5px;}
  .del-link{color:var(--red);font-size:12px;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 6px;}
  .del-link:hover{text-decoration:underline;}
  .edit-link{color:var(--navy-800);font-size:12px;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 6px;}
  .edit-link:hover{text-decoration:underline;}
  .row-actions{display:flex;align-items:center;gap:2px;white-space:nowrap;}
  .empty-row{padding:26px;text-align:center;color:var(--ink-soft);font-size:13px;}

  /* ===== Welcome / empty state ===== */
  .welcome{padding:60px 30px;text-align:center;}
  .welcome-mark{font-family:'Amiri',serif;font-size:44px;color:var(--navy-900);margin-bottom:6px;}
  .welcome p{color:var(--ink-soft);font-size:14px;max-width:380px;margin:8px auto 20px;line-height:1.9;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(13,27,46,0.55);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:8px;max-width:420px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0;font-size:16px;color:var(--navy-900);font-family:'Amiri',serif;}
  .modal-body{padding:18px 20px;}
  .modal-body label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;margin-top:12px;}
  .modal-body label:first-child{margin-top:0;}
  .modal-body input, .modal-body textarea{
    width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
    border:1px solid var(--line);border-radius:5px;
  }
  .modal-body input:focus, .modal-body textarea:focus{outline:none;border-color:var(--brass);}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  /* ===== Report ===== */
  .report-overlay{
    position:fixed;inset:0;background:rgba(13,27,46,0.6);z-index:60;
    display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px;
  }
  .report-overlay.show{display:flex;}
  .report-sheet{
    background:#fff;width:100%;max-width:720px;border-radius:6px;overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
  }
  .report-toolbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 20px;background:var(--navy-950);
  }
  .report-toolbar .rt-actions{display:flex;gap:8px;}
  .report-toolbar button{color:#fff;}
  .report-close{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 13px;font-size:12.5px;border-radius:5px;cursor:pointer;font-family:inherit;}

  .report-content{padding:38px 42px;}
  .report-content .r-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--navy-900);padding-bottom:18px;margin-bottom:22px;
  }
  .report-content .r-brand{display:flex;align-items:center;gap:12px;font-family:'Amiri',serif;font-size:20px;color:var(--navy-900);font-weight:700;}
  .report-content .r-brand img{height:38px;width:auto;object-fit:contain;}
  .report-content .r-brand .r-brand-text small{display:block;font-family:'IBM Plex Sans Arabic';font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:3px;}
  .work-detail{
    background:var(--paper);border-right:3px solid var(--brass);
    padding:10px 12px;margin-top:8px;border-radius:0 4px 4px 0;
    font-size:12.5px;color:var(--ink);line-height:1.8;
  }
  .work-detail .wd-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}
  .expense-block{border-bottom:1px solid var(--line);padding:14px 0;}
  .expense-block:last-child{border-bottom:none;}
  .expense-block .eb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .expense-block .eb-title{font-weight:700;font-size:13.5px;color:var(--navy-900);}
  .expense-block .eb-date{font-size:11.5px;color:var(--ink-soft);}
  .expense-block .eb-amount{font-weight:700;font-family:'Amiri',serif;font-size:15px;color:var(--navy-800);white-space:nowrap;}
  .report-content .r-date{font-size:12px;color:var(--ink-soft);text-align:left;}
  .report-content h4{font-size:13px;color:var(--navy-900);margin:26px 0 10px;text-transform:none;border-right:3px solid var(--brass);padding-right:9px;}
  .report-content table{font-size:12.5px;}
  .report-content thead th{background:var(--paper);}
  .report-summary{
    margin-top:26px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
    background:var(--line);border:1px solid var(--line);
  }
  .report-summary div{background:#fff;padding:14px;text-align:center;}
  .report-summary .lbl{font-size:11px;color:var(--ink-soft);}
  .report-summary .val{font-size:17px;font-weight:700;font-family:'Amiri',serif;margin-top:4px;}
  .r-footer-note{margin-top:26px;font-size:11.5px;color:var(--ink-soft);line-height:1.8;border-top:1px solid var(--line);padding-top:14px;}
  .r-contact-footer{
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
  }
  .r-contact-footer .rc-left{font-size:11px;color:var(--ink-soft);line-height:1.9;}
  .r-contact-footer .rc-left strong{color:var(--navy-900);font-family:'Amiri',serif;font-size:13px;}
  .r-contact-footer .rc-right{font-size:11px;color:var(--ink-soft);text-align:left;line-height:1.9;}
  .r-contact-footer a{color:var(--navy-800);text-decoration:none;}

  @media print{
    @page{ margin: 10mm; }
    body{margin:0;}
    .app, .overlay, .toast{display:none !important;}
    .report-overlay{
      position:static !important;
      background:none;padding:0;display:block !important;
      overflow:visible;inset:auto;
    }
    .report-sheet{box-shadow:none;max-width:100%;width:100%;border-radius:0;}
    .report-toolbar{display:none;}
    .report-content{padding:0 4mm;}
    .report-content .r-top{padding-bottom:10px;margin-bottom:14px;}
    .report-content .r-brand{font-size:17px;}
    .report-content .r-brand img{height:30px;}
    .report-content h4{margin:16px 0 8px;font-size:12px;}
    .report-content table{font-size:11px;}
    thead th{padding:6px 8px;}
    tbody td{padding:7px 8px;}
    .expense-block{padding:8px 0;}
    .expense-block .eb-title{font-size:12px;}
    .expense-block .eb-date{font-size:10.5px;}
    .expense-block .eb-amount{font-size:13px;}
    .work-detail{padding:7px 9px;font-size:11px;margin-top:6px;}
    .report-summary div{padding:9px;}
    .report-summary .val{font-size:15px;}
    .r-footer-note, .r-contact-footer{font-size:10px;padding-top:10px;margin-top:16px;}
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--navy-950);color:#fff;padding:11px 22px;border-radius:6px;
    font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<!-- Login gate -->
<div class="overlay show" id="loginOverlay">
  <div class="modal">
    <div class="modal-head"><h3>تسجيل الدخول</h3></div>
    <div class="modal-body">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="username">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <div id="loginError" style="color:var(--red);font-size:12.5px;margin-top:10px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-navy btn-sm" onclick="doLogin()" style="width:100%;">دخول</button>
    </div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">

  <div class="masthead">
    <div class="brand">
      <img class="brand-mark" id="brandLogo" alt="شعار المكتب">
      <div>
        <h1 id="firmTitle">حسابات المحامي</h1>
        <p>سجل الموكلين، الدفعات المستحقة، والمصروفات</p>
      </div>
    </div>
    <div class="lawyer-name-field">
      اسم المكتب / المحامي
      <br>
      <input id="lawyerName" type="text" placeholder="اكتب اسمك هنا">
      <div id="storageHint" style="font-size:10.5px;color:var(--ink-soft);margin-top:4px;">متصل بقاعدة بيانات Supabase</div>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()" style="margin-top:6px;padding:4px 10px;font-size:11.5px;">تسجيل خروج</button>
    </div>
  </div>

  <div class="layout">
    <!-- Client list -->
    <div class="panel">
      <div class="panel-head">
        <h2>الموكلون</h2>
        <button class="btn btn-brass btn-sm" onclick="openClientModal()">+ إضافة موكل</button>
      </div>
      <ul class="client-list" id="clientList"></ul>
    </div>

    <!-- Main -->
    <div class="panel main-panel" id="mainPanel"></div>
  </div>
</div>

<!-- Add / Edit client modal -->
<div class="overlay" id="clientModalOverlay">
  <div class="modal">
    <div class="modal-head"><h3 id="clientModalTitle">إضافة موكل جديد</h3></div>
    <div class="modal-body">
      <label>اسم الموكل</label>
      <input id="newClientName" type="text" placeholder="مثال: عمر كواره">
      <label>رقم الهاتف (اختياري)</label>
      <input id="newClientPhone" type="text" placeholder="05xxxxxxxx">
      <label>ملاحظات (اختياري)</label>
      <textarea id="newClientNote" rows="2" placeholder="نوع القضية أو أي ملاحظة عامة"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeClientModal()">إلغاء</button>
      <button class="btn btn-navy btn-sm" id="clientModalSaveBtn" onclick="saveClientModal()">حفظ</button>
    </div>
  </div>
</div>

<!-- Edit payment modal -->
<div class="overlay" id="paymentModalOverlay">
  <div class="modal">
    <div class="modal-head"><h3>تعديل الدفعة</h3></div>
    <div class="modal-body">
      <label>التاريخ</label>
      <input id="editPDate" type="date">
      <label>طريقة الدفع</label>
      <input id="editPMethod" type="text" placeholder="نقدًا، تحويل...">
      <label>المبلغ $</label>
      <input id="editPAmount" type="number" step="0.01">
      <label>ملاحظة</label>
      <input id="editPNote" type="text">
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closePaymentEditModal()">إلغاء</button>
      <button class="btn btn-navy btn-sm" onclick="savePaymentEdit()">حفظ التعديلات</button>
    </div>
  </div>
</div>

<!-- Edit expense modal -->
<div class="overlay" id="expenseModalOverlay">
  <div class="modal">
    <div class="modal-head"><h3>تعديل المصروف</h3></div>
    <div class="modal-body">
      <label>التاريخ</label>
      <input id="editEDate" type="date">
      <label>عنوان العمل / المصروف</label>
      <input id="editEDesc" type="text">
      <label>المبلغ $</label>
      <input id="editEAmount" type="number" step="0.01">
      <label>ملاحظة قصيرة (اختياري)</label>
      <input id="editENote" type="text">
      <label>شرح تفصيلي للعمل المُنجز (اختياري)</label>
      <textarea id="editEWork" rows="3"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" onclick="closeExpenseEditModal()">إلغاء</button>
      <button class="btn btn-navy btn-sm" onclick="saveExpenseEdit()">حفظ التعديلات</button>
    </div>
  </div>
</div>

<!-- Report modal -->
<div class="report-overlay" id="reportOverlay">
  <div class="report-sheet">
    <div class="report-toolbar">
      <div class="rt-actions">
        <button class="btn btn-brass btn-sm" onclick="window.print()">طباعة / حفظ PDF</button>
        <button class="btn btn-ghost btn-sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" onclick="copyReportText()">نسخ كنص</button>
      </div>
      <button class="report-close" onclick="closeReport()">إغلاق ✕</button>
    </div>
    <div class="report-content" id="reportContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ================= Auth ================= */
async function initAuth(){
  document.getElementById('brandLogo').src = LOGO_DATA_URI;

  const { data: { session } } = await sb.auth.getSession();
  if(session){ currentUser = session.user; await showApp(); }
  else { showLogin(); }

  sb.auth.onAuthStateChange(async (event, session)=>{
    if(session){
      currentUser = session.user;
      await showApp();
    } else {
      currentUser = null;
      showLogin();
    }
  });
}

function showLogin(){
  document.getElementById('loginOverlay').classList.add('show');
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
}

async function showApp(){
  document.getElementById('loginOverlay').classList.remove('show');
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('lawyerName').value = localStorage.getItem('lawyer-name') || 'Levant Law Firm';
  await loadState();
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'الرجاء إدخال البريد وكلمة المرور'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = 'بيانات الدخول غير صحيحة'; }
}

async function doLogout(){
  await sb.auth.signOut();
}

document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') doLogin();
});

document.getElementById('lawyerName').addEventListener('change', (e)=>{
  try{ localStorage.setItem('lawyer-name', e.target.value); }catch(err){}
});

/* ================= Load data from Supabase ================= */
async function loadState(){
  const [{ data: clients, error: e1 }, { data: payments, error: e2 }, { data: expenses, error: e3 }] = await Promise.all([
    sb.from('clients').select('*').order('created_at'),
    sb.from('payments').select('*').order('date'),
    sb.from('expenses').select('*').order('date')
  ]);

  if(e1 || e2 || e3){
    showToast('تعذر تحميل البيانات من قاعدة البيانات');
    console.error(e1, e2, e3);
  }

  state.clients = (clients||[]).map(c=>({ id:c.id, name:c.name, phone:c.phone, note:c.note }));
  state.payments = (payments||[]).map(p=>({ id:p.id, clientId:p.client_id, date:p.date, method:p.method, amount:p.amount, note:p.note }));
  state.expenses = (expenses||[]).map(e=>({ id:e.id, clientId:e.client_id, date:e.date, description:e.description, amount:e.amount, note:e.note, work:e.work }));

  render();
}

/* ================= Helpers ================= */
function fmt(n){
  const num = Number(n)||0;
  return '$' + num.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function clientBalance(clientId){
  const due = state.payments.filter(p=>p.clientId===clientId).reduce((s,p)=>s+Number(p.amount||0),0);
  const paid = state.expenses.filter(e=>e.clientId===clientId).reduce((s,e)=>s+Number(e.amount||0),0);
  return { due, paid, balance: due - paid };
}

/* ================= Rendering: client list ================= */
function render(){
  renderClientList();
  renderMain();
}

function renderClientList(){
  const ul = document.getElementById('clientList');
  if(state.clients.length===0){
    ul.innerHTML = '<div class="empty-hint">لا يوجد موكلون بعد.<br>اضغط "إضافة موكل" للبدء.</div>';
    return;
  }
  ul.innerHTML = state.clients.map(c=>{
    const b = clientBalance(c.id);
    const cls = b.balance >= 0 ? 'pos' : 'neg';
    const active = c.id === activeClientId ? 'active' : '';
    return `<li class="client-item ${active}" onclick="selectClient('${c.id}')">
      <div>
        <div class="c-name">${escapeHtml(c.name)}</div>
        <div class="c-balance ${cls}">الرصيد: ${fmt(b.balance)}</div>
      </div>
    </li>`;
  }).join('');
}

function selectClient(id){
  activeClientId = id;
  activeTab = 'payments';
  render();
}

/* ================= Rendering: main panel ================= */
function renderMain(){
  const main = document.getElementById('mainPanel');
  const client = state.clients.find(c=>c.id===activeClientId);
  if(!client){
    main.innerHTML = `<div class="welcome">
      <div class="welcome-mark">⚖</div>
      <p>اختر موكلاً من القائمة لعرض حساباته، أو أضف موكلاً جديدًا لبدء تسجيل الدفعات والمصروفات الخاصة به.</p>
      <button class="btn btn-navy" onclick="openClientModal()">+ إضافة موكل جديد</button>
    </div>`;
    return;
  }
  const b = clientBalance(client.id);
  const balCls = b.balance >= 0 ? 'pos' : 'neg';

  main.innerHTML = `
    <div class="client-header">
      <div>
        <h2>${escapeHtml(client.name)}</h2>
        <div class="client-meta">${client.phone ? 'هاتف: '+escapeHtml(client.phone)+' — ' : ''}${client.note ? escapeHtml(client.note) : 'لا توجد ملاحظات'}</div>
      </div>
      <div class="client-actions">
        <button class="btn btn-brass btn-sm" onclick="openReport('${client.id}')">📄 تقرير كامل</button>
        <button class="btn btn-ghost btn-sm" onclick="openExpenseReport('${client.id}')">🧾 تقرير المصروفات</button>
        <button class="btn btn-ghost btn-sm" onclick="openClientModal('${client.id}')">✎ تعديل بيانات الموكل</button>
        <button class="btn btn-danger-ghost" onclick="deleteClient('${client.id}')">حذف الموكل</button>
      </div>
    </div>

    <div class="balance-strip">
      <div class="bal-cell due"><div class="lbl">إجمالي الدفعات المستلمة</div><div class="val">${fmt(b.due)}</div></div>
      <div class="bal-cell paid"><div class="lbl">إجمالي المصروفات</div><div class="val">${fmt(b.paid)}</div></div>
      <div class="bal-cell balance"><div class="lbl">الرصيد المتبقي</div><div class="val ${balCls}">${fmt(b.balance)}</div></div>
    </div>

    <div class="tabs">
      <div class="tab ${activeTab==='payments'?'active':''}" onclick="setTab('payments')">الدفعات المستلمة</div>
      <div class="tab ${activeTab==='expenses'?'active':''}" onclick="setTab('expenses')">المصروفات</div>
    </div>

    <div class="tab-body" id="tabBody"></div>
  `;
  renderTabBody();
}

function setTab(tab){ activeTab = tab; renderTabBody(); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); event.target.classList.add('active'); }

function renderTabBody(){
  const body = document.getElementById('tabBody');
  const client = state.clients.find(c=>c.id===activeClientId);
  if(!client) return;

  if(activeTab === 'payments'){
    const rows = state.payments.filter(p=>p.clientId===client.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    body.innerHTML = `
      <div class="entry-form">
        <input type="date" id="pDate" value="${todayISO()}">
        <input type="text" id="pMethod" placeholder="طريقة الدفع (نقدًا، تحويل...)">
        <input type="number" id="pAmount" placeholder="المبلغ $" step="0.01">
        <input type="text" id="pNote" placeholder="ملاحظة">
        <button class="btn btn-navy btn-sm" onclick="addPayment('${client.id}')">+ إضافة دفعة</button>
      </div>
      ${renderTable(rows, 'payment')}
    `;
  } else {
    const rows = state.expenses.filter(e=>e.clientId===client.id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    body.innerHTML = `
      <div class="entry-form">
        <input type="date" id="eDate" value="${todayISO()}">
        <input type="text" id="eDesc" placeholder="عنوان العمل / المصروف (مختصر)">
        <input type="number" id="eAmount" placeholder="المبلغ $" step="0.01">
        <input type="text" id="eNote" placeholder="ملاحظة قصيرة (اختياري)">
        <textarea id="eWork" rows="2" placeholder="شرح تفصيلي للعمل الذي تم إنجازه مقابل هذا المبلغ (يظهر في التقرير)" style="grid-column:1/-1;font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:4px;resize:vertical;"></textarea>
        <button class="btn btn-navy btn-sm" onclick="addExpense('${client.id}')">+ إضافة مصروف</button>
      </div>
      ${renderExpenseTable(rows)}
    `;
  }
}

function renderTable(rows, type){
  if(rows.length===0){
    return `<div class="empty-row">لا توجد سجلات بعد.</div>`;
  }
  return `
    <table>
      <thead><tr>
        <th>التاريخ</th><th>طريقة الدفع</th><th>ملاحظة</th><th>المبلغ</th><th></th>

/* ================= CRUD ================= */
function openClientModal(id){
  editingClientId = id || null;
  const isEdit = !!editingClientId;
  document.getElementById('clientModalTitle').textContent = isEdit ? 'تعديل بيانات الموكل' : 'إضافة موكل جديد';
  document.getElementById('clientModalSaveBtn').textContent = isEdit ? 'حفظ التعديلات' : 'حفظ';

  if(isEdit){
    const c = state.clients.find(cl=>cl.id===editingClientId);
    if(!c) return;
    document.getElementById('newClientName').value = c.name || '';
    document.getElementById('newClientPhone').value = c.phone || '';
    document.getElementById('newClientNote').value = c.note || '';
  } else {
    document.getElementById('newClientName').value='';
    document.getElementById('newClientPhone').value='';
    document.getElementById('newClientNote').value='';
  }
  document.getElementById('clientModalOverlay').classList.add('show');
}
function closeClientModal(){
  document.getElementById('clientModalOverlay').classList.remove('show');
  editingClientId = null;
}

async function saveClientModal(){
  const name = document.getElementById('newClientName').value.trim();
  if(!name){ showToast('الرجاء إدخال اسم الموكل'); return; }
  const phone = document.getElementById('newClientPhone').value.trim();
  const note = document.getElementById('newClientNote').value.trim();

  if(editingClientId){
    const { data, error } = await sb.from('clients')
      .update({ name, phone, note })
      .eq('id', editingClientId)
      .select().single();

    if(error){ showToast('تعذر حفظ التعديلات'); console.error(error); return; }

    const c = state.clients.find(cl=>cl.id===editingClientId);
    if(c){ c.name = data.name; c.phone = data.phone; c.note = data.note; }
    closeClientModal();
    render();
    showToast('تم تعديل بيانات الموكل');
  } else {
    const { data, error } = await sb.from('clients')
      .insert({ user_id: currentUser.id, name, phone, note })
      .select().single();

    if(error){ showToast('تعذر حفظ الموكل'); console.error(error); return; }

    state.clients.push({ id: data.id, name: data.name, phone: data.phone, note: data.note });
    closeClientModal();
    activeClientId = data.id;
    render();
    showToast('تمت إضافة الموكل');
  }
}

async function deleteClient(id){
  if(!confirm('هل تريد حذف هذا الموكل وجميع دفعاته ومصروفاته؟')) return;

  const { error } = await sb.from('clients').delete().eq('id', id);
  if(error){ showToast('تعذر حذف الموكل'); console.error(error); return; }

  state.clients = state.clients.filter(c=>c.id!==id);
  state.payments = state.payments.filter(p=>p.clientId!==id);
  state.expenses = state.expenses.filter(e=>e.clientId!==id);
  if(activeClientId===id) activeClientId=null;
  render();
  showToast('تم حذف الموكل');
}

async function deleteEntry(type, id){
  const table = type === 'payment' ? 'payments' : 'expenses';
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ showToast('تعذر الحذف'); console.error(error); return; }

  if(type==='payment'){ state.payments = state.payments.filter(p=>p.id!==id); }
  else { state.expenses = state.expenses.filter(e=>e.id!==id); }
  render();
  showToast('تم الحذف');
}

function copyReportText(){

  const client = state.clients.find(c=>c.id===clientId);

    txt += contactBlock;
  } else {
    txt = `تقرير حساب — ${lawyerName}\nالموكل: ${client.name}\nتاريخ: ${new Date().toLocaleDateString('ar-EG')}\n\n`;

/* ================= Utils ================= */
function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
